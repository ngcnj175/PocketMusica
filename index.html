<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="Pocket Musica - スマホで手軽にメロディメモできるチップチューン風シーケンサー">
    <title>Pocket Musica</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1 class="app-title">Pocket Musica</h1>
            <div class="header-controls">
                <button class="header-btn" id="btn-clear" title="Clear">🗑️</button>
                <button class="header-btn" id="btn-load" title="Load">📂</button>
                <button class="header-btn" id="btn-save" title="Save">💾</button>
                <div class="tempo-control">
                    <button class="tempo-btn" id="tempo-down">−</button>
                    <span class="tempo-display"><span id="bpm-value">120</span></span>
                    <button class="tempo-btn" id="tempo-up">+</button>
                </div>
            </div>
            <input type="file" id="file-input" accept=".json" style="display: none;">
        </header>

        <!-- Track Tabs -->
        <div class="track-tabs" id="track-tabs">
            <button class="track-tab active" data-track="0">
                <span class="track-num">1</span>
                <span class="track-type">PULSE</span>
            </button>
            <button class="track-tab" data-track="1">
                <span class="track-num">2</span>
                <span class="track-type">PULSE</span>
            </button>
            <button class="track-tab" data-track="2">
                <span class="track-num">3</span>
                <span class="track-type">TRI</span>
            </button>
            <button class="track-tab" data-track="3">
                <span class="track-num">4</span>
                <span class="track-type">NOISE</span>
            </button>
        </div>

        <!-- Sound Type Selector -->
        <div class="sound-selector" id="sound-selector">
            <button class="sound-option" data-sound="pulse1">PULSE 1</button>
            <button class="sound-option" data-sound="pulse2">PULSE 2</button>
            <button class="sound-option" data-sound="triangle">TRIANGLE</button>
            <button class="sound-option" data-sound="noise">NOISE</button>
        </div>

        <!-- Pattern Grid -->
        <div class="grid-section">
            <div class="grid-header">
                <div class="division-buttons">
                    <span class="control-label">DIV</span>
                    <button class="div-btn" data-division="8">8</button>
                    <button class="div-btn active" data-division="16">16</button>
                    <button class="div-btn" data-division="32">32</button>
                </div>
                <div class="loop-button">
                    <button class="loop-btn active" id="btn-loop">LOOP</button>
                </div>
                <div class="length-buttons">
                    <span class="control-label">LEN</span>
                    <button class="len-btn" data-length="8">8</button>
                    <button class="len-btn active" data-length="16">16</button>
                    <button class="len-btn" data-length="32">32</button>
                    <button class="len-btn" data-length="64">64</button>
                </div>
            </div>
            <div class="step-grid" id="step-grid">
                <!-- 64 steps will be generated by JavaScript -->
            </div>
        </div>

        <!-- Sequencer Controls -->
        <div class="seq-controls">
            <button class="seq-btn" id="btn-del">
                <span class="seq-icon">←</span>
                <span class="seq-label">DEL</span>
            </button>
            <button class="seq-btn" id="btn-rest">
                <span class="seq-icon">𝄽</span>
                <span class="seq-label">REST</span>
            </button>
            <button class="seq-btn" id="btn-tie">
                <span class="seq-icon">⁀</span>
                <span class="seq-label">TIE</span>
            </button>
            <button class="seq-btn play-btn" id="btn-play-stop">
                <span class="seq-icon play-icon">▶</span>
                <span class="seq-label">PLAY</span>
            </button>
            <button class="seq-btn rec-btn" id="btn-rec">
                <span class="seq-icon">●</span>
                <span class="seq-label">REC</span>
            </button>
        </div>

        <!-- Piano Keyboard -->
        <div class="keyboard-section">
            <div class="keyboard-scroll-bar" id="keyboard-scroll-bar">
                <div class="scroll-indicator" id="scroll-indicator"></div>
            </div>
            <div class="keyboard-wrapper" id="keyboard-wrapper">
                <div class="keyboard" id="keyboard">
                    <!-- Keys will be generated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Mixer Section -->
        <div class="mixer-section">
            <div class="mixer" id="mixer">
                <div class="track-mixer" data-track="0">
                    <span class="mixer-volume">100</span>
                    <span class="track-label">1</span>
                </div>
                <div class="track-mixer" data-track="1">
                    <span class="mixer-volume">100</span>
                    <span class="track-label">2</span>
                </div>
                <div class="track-mixer" data-track="2">
                    <span class="mixer-volume">100</span>
                    <span class="track-label">3</span>
                </div>
                <div class="track-mixer" data-track="3">
                    <span class="mixer-volume">100</span>
                    <span class="track-label">4</span>
                </div>
            </div>
        </div>
    </div>

    <script src="audio.js"></script>
    <script src="app.js"></script>
</body>

</html>
